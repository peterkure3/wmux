[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
rust-version = "1.99"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
portable-pty = "0.9"
vt100 = "0.16"
rusqlite = { version = "0.32", features = ["bundled"] }
wmux-core = { path = "crates/wmux-core" }
wmux-security = { path = "crates/wmux-security" }
wmux-terminal = { path = "crates/wmux-terminal" }
wmux-pty = { path = "crates/wmux-pty" }
wmux-storage = { path = "crates/wmux-storage" }
wmux-ipc = { path = "crates/wmux-ipc" }
wmux-agents = { path = "crates/wmux-agents" }
wmux-git = { path = "crates/wmux-git" }
wmux-daemon = { path = "crates/wmux-daemon" }
wmux-tui = { path = "crates/wmux-tui" }

[profile.release]
lto = "thin"
strip = true
