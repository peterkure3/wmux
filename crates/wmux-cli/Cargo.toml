[package]
name = "wmux-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[[bin]]
name = "wmux"
path = "src/main.rs"
[dependencies]
anyhow.workspace = true
tokio.workspace = true
clap.workspace = true
serde_json.workspace = true
toml.workspace = true
wmux-core.workspace = true
wmux-ipc.workspace = true
wmux-tui.workspace = true
wmux-pty.workspace = true
wmux-agents.workspace = true
wmux-git.workspace = true
wmux-terminal.workspace = true
wmux-security.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation","Win32_Security","Win32_System_Threading"] }
[target.'cfg(unix)'.dependencies]
libc = "0.2"
